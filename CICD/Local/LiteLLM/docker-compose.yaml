name: trading-services-genai-platfrom

# Starts after Postgres and Redis are up. Login and keys come from the repo-root .env.
# Host port defaults to 4000. Database defaults match CICD/Local/Postgres.
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "${NUM_WORKERS:-1}"
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    env_file:
      - path: ../../../.env
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MODE: PRODUCTION
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    volumes:
      - ./config.runtime.yaml:/app/config.yaml:ro
    networks:
      - local
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  local:
    name: trading-services-local
    external: true
