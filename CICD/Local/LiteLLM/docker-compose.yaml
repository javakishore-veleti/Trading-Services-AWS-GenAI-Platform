name: trading-services-genai-platfrom

# Starts after Postgres is up. Login and keys come from the repo-root .env.
# Host port defaults to 4000. Database defaults match CICD/Local/Postgres.
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - path: ../../../.env
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      STORE_MODEL_IN_DB: "True"
    networks:
      - local
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  local:
    name: trading-services-local
    external: true
