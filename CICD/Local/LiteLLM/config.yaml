# Single container. Redis and Ollama are separate compose projects on the shared network.
# vLLM and SGLang stay in their own compose files for a machine with an NVIDIA GPU.
# This laptop does not start them, so they are not routes here.
# The Ollama row always uses the Docker name ollama. That name is the Ollama container, or a proxy to the host.
# router_settings shares router state. The cache block is also what coordinates
# rate limits and budgets. A migrations job and extra replicas stay off.
model_list:
  # ollama-models-start
  # Dropped from the running config when the ollama command is not installed.
  - model_name: deepseek-r1-8b-ollama
    litellm_params:
      model: ollama/deepseek-r1:8b
      api_base: http://ollama:11434
  # ollama-models-end
  # Any bedrock/<model id> request. A call is what reaches AWS. Saving this row does not.
  - model_name: bedrock/*
    litellm_params:
      model: bedrock/*
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true
  trusted_proxy_ranges: []
  store_model_in_db: true
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  # A key or team with no vector-store grant can search nothing.
  vector_store_deny_by_default: true

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
