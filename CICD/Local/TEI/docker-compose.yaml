name: trading-services-genai-tei

# Own compose file. This Mac uses the arm64 CPU image. Docker does not use Metal.
services:
  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9}
    platform: ${TEI_PLATFORM:-linux/arm64}
    command:
      - --model-id
      - ${TEI_MODEL:-BAAI/bge-small-en-v1.5}
      - --port
      - "80"
    ports:
      - "127.0.0.1:${TEI_PORT:-8080}:80"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei_data:/data
    networks:
      local:
        aliases:
          - tei
    restart: unless-stopped

networks:
  local:
    name: trading-services-local
    external: true

volumes:
  tei_data:
