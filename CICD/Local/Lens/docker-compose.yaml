name: trading-services-genai-lens

# Own compose file. There is no published Lens image yet.
# Build lens:local from https://github.com/BerriAI/lens deploy/runtime/Dockerfile.
services:
  lens:
    image: ${LENS_IMAGE:-lens:local}
    environment:
      LENS_MODE: standalone
      LENS_ADMIN_TOKEN: ${LENS_ADMIN_TOKEN:?Set LENS_ADMIN_TOKEN in .env}
      LENS_PUBLIC_URL: http://127.0.0.1:${LENS_PORT:-4318}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: lens
      AGENT_TRACING_RETENTION_DAYS: ${AGENT_TRACING_RETENTION_DAYS:-14}
      LITELLM_LENS_SERVICE_TOKEN: ${LITELLM_LENS_SERVICE_TOKEN:?Set LITELLM_LENS_SERVICE_TOKEN in .env}
      LENS_GATEWAY_SECRET: ${LENS_GATEWAY_SECRET:?Set LENS_GATEWAY_SECRET in .env}
    ports:
      - "127.0.0.1:${LENS_PORT:-4318}:4318"
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
      - storage
    restart: unless-stopped

networks:
  local:
    name: trading-services-local
    external: true
  storage:
    name: trading-services-lens-storage
    external: true
