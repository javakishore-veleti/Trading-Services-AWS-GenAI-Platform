name: trading-services-genai-pgvector-connector

# One process routes each store id to that team's database.
services:
  pgvector-connector:
    build: .
    image: trading-services-pgvector-connector:local
    ports:
      - "127.0.0.1:${PGVECTOR_CONNECTOR_PORT:-8001}:8000"
    environment:
      CATALOG_URL: postgresql://pgvector_router:${PGVECTOR_ROUTER_PASSWORD:?Set PGVECTOR_ROUTER_PASSWORD in .env}@pgvector:5432/${PGVECTOR_DB:-pgvector}
      EMBEDDING__MODEL: ${PGVECTOR_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING__BASE_URL: http://litellm:4000
      EMBEDDING__API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      EMBEDDING__DIMENSIONS: ${PGVECTOR_EMBEDDING_DIMENSIONS:-1536}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - local
    restart: unless-stopped

networks:
  local:
    name: trading-services-local
    external: true
