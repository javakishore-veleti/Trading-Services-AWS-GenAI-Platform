name: trading-services-genai-redis

# Own compose file. Joins the shared network; does not define Postgres or LiteLLM.
services:
  redis:
    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - local

networks:
  local:
    name: trading-services-local
    external: true

volumes:
  redis_data:
