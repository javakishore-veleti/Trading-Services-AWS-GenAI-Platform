name: trading-services-genai-pgvector

# Vector database only. The connector is a separate compose file.
services:
  pgvector:
    image: pgvector/pgvector:pg15
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-pgvector}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-pgvector}
      POSTGRES_DB: ${PGVECTOR_DB:-pgvector}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - local
    restart: unless-stopped

networks:
  local:
    name: trading-services-local
    external: true

volumes:
  pgvector_data:
