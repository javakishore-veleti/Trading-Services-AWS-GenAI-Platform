[project]
name = "strands-db"
version = "0.1.0"
description = "Strands session and memory tables in the platform Postgres schema strands."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "strands-agents==1.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strands_db"]
