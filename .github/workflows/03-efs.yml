name: "03 - efs"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: "APPLY for apply, DESTROY for destroy"
        type: string
        default: ""

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  stage:
    uses: ./.github/workflows/_stage.yml
    with:
      stage_dir: 03-efs
      action: ${{ inputs.action }}
      confirm: ${{ inputs.confirm }}
      needs_cluster: false
    secrets: inherit
