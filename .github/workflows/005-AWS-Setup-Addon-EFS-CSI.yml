name: "005-AWS-Setup-Addon-EFS-CSI"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (no changes) or apply"
        type: choice
        options: [plan, apply]
        default: plan
      confirm:
        description: "Type APPLY to apply"
        type: string
        default: ""

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  stage:
    uses: ./.github/workflows/_stage.yml
    with:
      stage_dir: 05-addon-efs-csi
      action: ${{ inputs.action }}
      confirm: ${{ inputs.confirm }}
      needs_cluster: true
    secrets: inherit
