name: "05 - addon efs csi"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: "APPLY for apply, DESTROY for destroy"
        type: string
        default: ""

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  stage:
    uses: ./.github/workflows/_stage.yml
    with:
      stage_dir: 05-addon-efs-csi
      action: ${{ inputs.action }}
      confirm: ${{ inputs.confirm }}
      needs_cluster: true
    secrets: inherit
