name: "016-AWS-Destroy-ECR-and-Build"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to delete this stage"
        type: string
        default: ""

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  stage:
    uses: ./.github/workflows/_stage.yml
    with:
      stage_dir: 16-ecr-and-build
      action: destroy
      confirm: ${{ inputs.confirm }}
      needs_cluster: false
    secrets: inherit
