name: "099-AWS-Destroy-All"

# Tears down every stage, newest first, by calling each stage's destroy path through _stage.yml.
# Each destroy job waits for sandbox approval. The VPC is never deleted.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to run"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::confirm must be DESTROY"
            exit 1
          fi

  d11:
    needs: guard
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 11-vllm-model, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d10:
    needs: d11
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 10-gpu-nodepool, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d09:
    needs: d10
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 09-smoke-app, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d07:
    needs: d09
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 07-addon-ingress-nginx, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d06:
    needs: d07
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 06-addon-lb-controller, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d05:
    needs: d06
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 05-addon-efs-csi, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d04:
    needs: d05
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 04-eks-cluster, action: destroy, confirm: DESTROY, needs_cluster: false}
    secrets: inherit

  d03:
    needs: d04
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 03-efs, action: destroy, confirm: DESTROY, needs_cluster: false}
    secrets: inherit

  d02:
    needs: d03
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 02-vpc-subnet-tags, action: destroy, confirm: DESTROY, needs_cluster: false}
    secrets: inherit
