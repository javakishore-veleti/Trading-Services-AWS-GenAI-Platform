name: "099-AWS-Destroy-All"

# Tears down every stage, newest first, by calling each stage's destroy path through _stage.yml.
# Stage 19 (OIDC role) and the VPC are not touched. The VPC is never deleted.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to run"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: genai-eks
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::confirm must be DESTROY"
            exit 1
          fi

  d017:
    needs: guard
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 17-strands-calculator-agent, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d016:
    needs: d017
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 16-ecr-and-build, action: destroy, confirm: DESTROY, needs_cluster: false}
    secrets: inherit

  d015:
    needs: d016
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 15-qdrant, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d014:
    needs: d015
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 14-tei-embedding, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d013:
    needs: d014
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 13-openwebui, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d012:
    needs: d013
    uses: ./.github/workflows/_stage.yml
    with: {stage_dir: 12-litellm, action: destroy, confirm: DESTROY, needs_cluster: true}
    secrets: inherit

  d011:
